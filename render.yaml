services:
  - type: web
    name: skillforge-ai
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillforge-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: skillforge-ai-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: fake
      - key: CORS_ORIGINS
        value: '["https://skillforge-ai.onrender.com"]'

  - type: keyvalue
    name: skillforge-ai-redis
    plan: free
    ipAllowList: []

databases:
  - name: skillforge-ai-db
    databaseName: skillforge
    user: skillforge
    plan: free
    postgresMajorVersion: "16"
