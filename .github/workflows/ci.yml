name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: skillforge
          POSTGRES_DB: skillforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          black --check app tests scripts
          isort --check-only app tests scripts
          ruff check app tests scripts

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://skillforge:skillforge@localhost:5432/skillforge_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-that-is-long-enough-for-hmac256
        run: pytest --cov=app --cov-report=term-missing

      - name: Coverage gate (services + api must be >= 80%)
        run: coverage report --include="app/services/*,app/api/*" --fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests-frontend/package-lock.json

      - name: Install jsdom
        run: npm ci

      - name: Run the frontend tests
        run: npm test

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t skillforge-ai:ci .

      - name: Start the container
        run: docker run -d --name skillforge -p 8000:8000 skillforge-ai:ci

      - name: Check that pages and static files are served
        run: |
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/ && break
            sleep 1
          done
          for page in / /register /login; do
            curl -sf -o page.html "http://localhost:8000$page"
            grep -q "<title>" page.html
          done
          curl -sf -o /dev/null http://localhost:8000/static/js/api.js
          curl -sf -o /dev/null http://localhost:8000/static/favicon.svg
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: text/html" \
            http://localhost:8000/no-such-page)
          test "$status" = "404"

      - name: Show the container log
        if: failure()
        run: docker logs skillforge
